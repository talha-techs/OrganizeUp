<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="org-ember" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e64a19" />
      <stop offset="50%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#ff9100" />
    </linearGradient>
    <linearGradient id="org-ember-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a65" />
      <stop offset="100%" stop-color="#ff5722" />
    </linearGradient>
    <linearGradient id="org-folder-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="org-folder-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#121215" />
    </linearGradient>
    <linearGradient id="org-card-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7043" />
      <stop offset="100%" stop-color="#d84315" />
    </linearGradient>
    <linearGradient id="org-card-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>
    <linearGradient id="org-orbit" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5722" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#ff5722" />
      <stop offset="100%" stop-color="#ffab40" />
    </linearGradient>
  </defs>

  <g transform="translate(0, -10)">
    <!-- BACK OF FOLDER -->
    <path d="M 130 190 L 210 190 L 240 215 L 360 215 Q 375 215 375 230 L 375 350 Q 375 365 360 365 L 145 365 Q 130 365 130 350 Z" 
          fill="url(#org-folder-back)" stroke="#52525b" stroke-width="2"/>

    <!-- RESOURCE SHEETS POPPING OUT -->
    <!-- Sheet 2: Media Card (Orange, tilted right) -->
    <g transform="rotate(9, 256, 256)">
      <rect x="220" y="145" width="125" height="165" rx="14" fill="url(#org-card-orange)" stroke="rgba(255,255,255,0.3)" stroke-width="2.5"/>
      <!-- Play Icon inside Media Card -->
      <polygon points="272,192 272,228 302,210" fill="#ffffff" />
      <!-- Course bar lines -->
      <line x1="240" y1="250" x2="325" y2="250" stroke="rgba(255,255,255,0.7)" stroke-width="5" stroke-linecap="round" />
      <line x1="240" y1="270" x2="295" y2="270" stroke="rgba(255,255,255,0.4)" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Sheet 1: Document/PDF Page (White, tilted left) -->
    <g transform="rotate(-6, 210, 240)">
      <rect x="150" y="130" width="125" height="175" rx="14" fill="url(#org-card-white)" stroke="#d4d4d8" stroke-width="2"/>
      <!-- Folded Corner -->
      <path d="M 245 130 L 275 160 L 245 160 Z" fill="#a1a1aa" />
      <!-- Bookmark Ribbon -->
      <path d="M 175 130 L 175 185 L 187 175 L 199 185 L 199 130 Z" fill="url(#org-ember)" />
      <!-- Document Text Lines -->
      <line x1="172" y1="205" x2="252" y2="205" stroke="#71717a" stroke-width="5" stroke-linecap="round" />
      <line x1="172" y1="225" x2="242" y2="225" stroke="#a1a1aa" stroke-width="4.5" stroke-linecap="round" />
      <line x1="172" y1="245" x2="252" y2="245" stroke="#a1a1aa" stroke-width="4.5" stroke-linecap="round" />
    </g>

    <!-- FRONT OF FOLDER (Glossy modern tech container) -->
    <path d="M 105 245 L 205 245 L 235 272 L 385 272 Q 400 272 396 290 L 378 395 Q 375 408 360 408 L 130 408 Q 115 408 112 395 L 94 263 Q 91 245 105 245 Z" 
          fill="url(#org-folder-front)" stroke="#3f3f46" stroke-width="3" />
    <!-- Folder Edge Glow/Rim -->
    <path d="M 105 245 L 205 245 L 235 272 L 385 272" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />

    <!-- CLOUD UPLOAD EMBLEM ON FOLDER FRONT -->
    <g transform="translate(205, 310) scale(1.6)">
      <!-- Cloud Body -->
      <path d="M 11 27 C 6.5 27 3 23.5 3 19 C 3 14.8 6.2 11.5 10.3 11 C 11.6 5.8 16.3 2 22 2 C 28.2 2 33.3 6.6 34 12.6 C 37.5 13.2 40 16.2 40 19.8 C 40 23.8 36.8 27 32.8 27 Z" 
            fill="#ffffff" />
      <!-- Arrow Up inside Cloud -->
      <polygon points="22,7 15,15 19,15 19,23 25,23 25,15 29,15" fill="#ff5722" />
    </g>

    <!-- DYNAMIC SWEEPING ORBITAL ARROW ("UP") -->
    <!-- Orbiting Ring -->
    <path d="M 85 385 C 75 440 155 475 250 475 C 340 475 410 440 435 375 C 448 340 450 305 450 265" 
          fill="none" stroke="url(#opt1-orbit)" stroke-width="16" stroke-linecap="round" />
    <!-- Bright Center Trace -->
    <path d="M 120 420 C 180 455 250 460 315 450 C 375 435 420 395 440 330" 
          fill="none" stroke="#ffab40" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    <!-- Arrowhead at Orbit Apex -->
    <polygon points="420,285 450,210 482,272 454,262" fill="url(#opt1-ember)" stroke="#ffab40" stroke-width="2" stroke-linejoin="round" />
  </g>
</svg>